version: 2
updates:
  - package-ecosystem: pip
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: deps
      prefix-development: chore(deps-dev)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        applies-to: version-updates
        dependency-type: production
      dev-minor-and-patch:
        update-types: [minor, patch]
        applies-to: version-updates
        dependency-type: development

  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: deps
      prefix-development: chore(deps-dev)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
